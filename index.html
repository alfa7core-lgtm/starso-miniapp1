
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarsoGames Security Check</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 25px;
            background: #17212b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            margin-top: 70px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 23px;
        }

        p {
            color: #aebac5;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #2481cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🛡️</div>

    <h2>Проверка безопасности</h2>

    <p>
        Перед продолжением необходимо пройти
        проверку безопасности.
    </p>

    <p>
        Мы проверим параметры сети и браузера
        для защиты от мошенничества.
    </p>

    <button onclick="startCheck()">
        Начать проверку
    </button>

</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function startCheck() {
        alert("Проверка будет доступна после подключения сервера.");
    }
</script>

</body>
</html>
